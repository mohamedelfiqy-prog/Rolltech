<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#004b85">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">

<title>رول تك | نظام المشاريع</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f2;--surf:#fff;--ink:#1b2430;--mut:#5d6877;--line:#d3d8de;--acc:#e8a317;--hd:#004b85;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surf:#1c232b;--ink:#e8ecf0;--mut:#9aa5b2;--line:#323c47;--hd:#00315a}}
:root[data-theme="dark"]{--bg:#12161b;--surf:#1c232b;--ink:#e8ecf0;--mut:#9aa5b2;--line:#323c47;--hd:#00315a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
header{background:var(--hd);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--acc)}
.mark{width:38px;height:38px;border-radius:6px;flex:none}
header h1{font-size:17px;margin:0}
nav{display:flex;background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:500;padding:12px 4px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:700}
main{max-width:860px;margin:0 auto;padding:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;margin-top:3px;padding:9px 10px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.full{grid-column:1/-1}
button.b{font:inherit;font-weight:500;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:#1b2430;border-color:var(--acc);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.top{display:flex;gap:8px;margin-bottom:12px}.top input{margin:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item small{color:var(--mut);display:block}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1px 9px;color:var(--mut);white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
h2{font-size:16px;margin:0 0 10px}
.items{grid-column:1/-1;overflow-x:auto}
.items table{width:100%;border-collapse:collapse;min-width:520px}
.items th{font-size:12px;color:var(--mut);text-align:right;font-weight:500}
.items td{padding:3px}.items input{margin:0;padding:7px}
.tot{grid-column:1/-1;text-align:left;font-weight:700}
#doc{display:none}
#doc.show{display:block;position:fixed;inset:0;z-index:20;background:#fff;color:#000;overflow:auto;padding:16px;font-size:13px}
#doc .nop button{font:inherit;padding:8px 14px;border-radius:4px;border:1px solid #bbb;background:#fff;color:#000;cursor:pointer}#doc .nop button.p{background:#e8a317;border-color:#e8a317;font-weight:700}
@media print{body{background:#fff;color:#000}header,nav,main{display:none}#doc,#doc.show{display:block;position:static;overflow:visible;padding:0;font-size:13px;color:#000}.nop{display:none!important}@page{margin:14mm}}
#doc .th{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #e8a317;padding-bottom:10px;margin-bottom:14px}
#doc .br{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
#doc .br i{width:32px;height:32px;border-radius:50%;border:5px solid #e8a317;display:block}
#doc table{width:100%;border-collapse:collapse;margin:6px 0 12px}
#doc td,#doc th{border:1px solid #bbb;padding:6px 8px;text-align:right;vertical-align:top}
#doc th{background:#f1f2f4}#doc .k{width:34%;background:#f1f2f4;font-weight:500}
#doc .sec{font-weight:700;margin-top:10px;border-right:4px solid #e8a317;padding-right:8px}
#doc .sig{display:flex;justify-content:space-between;margin-top:40px}#doc .sig div{width:40%;border-top:1px solid #000;padding-top:4px;text-align:center}
</style>
</head>
