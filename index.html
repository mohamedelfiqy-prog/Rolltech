<style>
:root{--bg:#eef0f2;--surf:#fff;--ink:#1b2430;--mut:#5d6877;--line:#d3d8de;--acc:#e8a317;--hd:#004b85;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surf:#1c232b;--ink:#e8ecf0;--mut:#9aa5b2;--line:#323c47;--hd:#00315a}}
:root[data-theme="dark"]{--bg:#12161b;--surf:#1c232b;--ink:#e8ecf0;--mut:#9aa5b2;--line:#323c47;--hd:#00315a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
header{background:var(--hd);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--acc)}
.mark{width:38px;height:38px;border-radius:6px;flex:none}
header h1{font-size:17px;margin:0}
.hb{background:none;border:0;color:#fff;font:inherit;font-size:28px;line-height:1;cursor:pointer;padding:0 6px 4px}
.hb[hidden]{display:none}
nav{display:flex;overflow-x:auto;background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:1 0 auto;border:0;background:none;color:var(--mut);font:inherit;font-size:14px;font-weight:500;padding:12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:700}
main{max-width:860px;margin:0 auto;padding:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;margin-top:3px;padding:9px 10px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.full{grid-column:1/-1}
button.b{font:inherit;font-weight:500;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:#1b2430;border-color:var(--acc);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.top{display:flex;gap:8px;margin-bottom:12px}.top input,.top select{margin:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item small{color:var(--mut);display:block}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1px 9px;color:var(--mut);white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
h2{font-size:16px;margin:0 0 10px}
.ic{grid-column:1/-1;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;background:var(--bg)}
.ic input,.ic select,.ic textarea{background:var(--surf)}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ig.rw{margin-top:8px;align-items:center}
.ig.rw input{margin:0}
.lf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--mut)}
.lf b{color:var(--ink)}
.tot{grid-column:1/-1;font-weight:700;line-height:2}
.tot .r{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);font-weight:400}
.tot .r.s{font-weight:700;border-bottom:0}
.note{font-size:13px;color:var(--mut);margin:0 0 10px}
#doc{display:none}
#doc.show{display:block;position:fixed;inset:0;z-index:20;background:#fff;color:#000;overflow:auto;padding:16px;font-size:13px}
#doc .tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;position:sticky;top:0;background:#fff;padding:6px 0;z-index:3}
#doc .tb button{font:inherit;padding:8px 14px;border-radius:4px;border:1px solid #bbb;background:#fff;color:#000;cursor:pointer}#doc .tb button.p{background:#e8a317;border-color:#e8a317;font-weight:700}
#doc .tb select{width:auto;margin:0;padding:8px;background:#fff;color:#000;border:1px solid #bbb}
#pbody{position:relative;z-index:1;max-width:820px;margin:0 auto}
.wm{position:fixed;top:50%;left:50%;width:min(70vw,420px);transform:translate(-50%,-50%);opacity:.08;z-index:0;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media screen{#doc{padding:16px}}
@media print{body{background:#fff;color:#000}header,nav,main{display:none}#doc,#doc.show{display:block;position:static;overflow:visible;padding:0;font-size:13px;color:#000}#pbody{max-width:none}.nop{display:none!important}.wm{width:120mm}@page{margin:0}#doc table.pg{height:292mm}}
#doc table{width:100%;border-collapse:collapse;margin:6px 0 12px}
#doc td,#doc th{border:1px solid #bbb;padding:6px 8px;text-align:start;vertical-align:top}
#doc th{background:rgba(241,242,244,.75)}#doc .k{width:22%;background:rgba(241,242,244,.75);font-weight:500}
#doc table.pg{margin:0;border:0}
#doc table.pg>thead>tr>td,#doc table.pg>tbody>tr>td,#doc table.pg>tfoot>tr>td{border:0;padding:0}
#doc table.pg>tbody>tr>td.pgb{padding:10px 12mm;height:100%}
#doc table.pg>tfoot{vertical-align:bottom}
.lh{display:flex;direction:ltr;justify-content:space-between;align-items:center;gap:12px;background:#004b85;color:#fff;padding:10px 12mm;border-bottom:6px solid #e8a317;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lh1{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}.lh1 img{width:54px;height:54px;border-radius:6px;display:block}
.lh2{text-align:right;direction:rtl;line-height:1.4}.lh2 b{display:block;font-size:30px}.lh2 span{font-size:13px}
.fo{background:#004b85;color:#fff;text-align:center;padding:8px 12mm;border-top:5px solid #e8a317;font-size:13px;line-height:1.7;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#doc .sec{font-weight:700;margin-top:12px;border-inline-start:4px solid #e8a317;padding-inline-start:8px}
#doc .ht td{font-size:14px}#doc .tt{font-size:18px;font-weight:700;text-align:center}
#doc table.sp{direction:ltr;break-inside:avoid;margin:10px 0}
#doc .sp th{background:#fff;font-size:15px;text-align:start}
#doc .no{width:30px;text-align:center}
#doc .yl{background:#fff200;text-align:center;font-weight:500;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#doc .tl{margin:4px 0;font-size:14px;font-weight:700;line-height:1.65}
#doc .cl{text-align:center;margin:18px 0 6px}
#doc .sgn{line-height:1.9;margin-top:6px;position:relative}#doc .sgn.hs{min-height:36mm}#doc .stp{position:absolute;top:-2mm;inset-inline-start:14mm;height:auto;max-width:none;mix-blend-mode:multiply;transform:rotate(-8deg);opacity:.95;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#doc .si{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
#doc .si.n1{grid-template-columns:1fr}
#doc .si figure{margin:0;text-align:center;break-inside:avoid}
#doc .si img{max-width:100%;max-height:85mm;object-fit:contain}
#doc .si.n1 img{max-height:125mm}
#doc .si figcaption{font-size:12px;color:#444}
#doc table.sm{width:60%;margin-inline-start:auto}
#doc table.sm td:last-child{text-align:end;white-space:nowrap}
#doc table.pg{break-after:page;page-break-after:always}
#doc table.pg:last-child{break-after:auto;page-break-after:auto}
@media screen{#doc table.pg{margin:0 0 18px;box-shadow:0 0 0 1px #ccc}}
/* خط موحّد ومضبوط تلقائياً لعروض الأسعار الرسمية */
#doc,#doc table,#doc td,#doc th,#doc div{font-family:"Segoe UI",Tahoma,Arial,"Geeza Pro","Noto Naskh Arabic",sans-serif}
#pbody{font-size:14px;line-height:1.75}
#doc table td,#doc table th{font-size:13.5px;line-height:1.7}
#doc .ht td{font-size:14.5px}#doc .tt{font-size:21px;font-weight:800;letter-spacing:0}
#doc th{font-weight:700}#doc .sp th{font-size:15px;font-weight:700}
#doc .sec{font-size:15.5px;font-weight:800;margin-top:14px}
#doc .tl{font-size:14px;font-weight:600;line-height:1.85;text-align:justify}
#doc td.fq,#doc td.fp,#doc td.ft,#doc td.gs,#doc td.gv,#doc td.gn{font-variant-numeric:tabular-nums;white-space:nowrap}
#doc .cl{font-size:14px;font-weight:600}#doc .sgn{font-size:14px;font-weight:600}
@media print{#pbody{font-size:12pt}#doc table td,#doc table th{font-size:11pt}#doc .ht td{font-size:12pt}#doc .tt{font-size:17pt}#doc .sp th{font-size:12.5pt}#doc .sec{font-size:13pt}#doc .tl,#doc .cl,#doc .sgn{font-size:11.5pt}}
.bl{display:block;font-weight:500;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;text-align:center}
.gd{background:var(--surf);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.gd summary{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;cursor:pointer;font-weight:700;list-style:none}
.gd summary::-webkit-details-marker{display:none}
.gd summary b{color:var(--acc)}
.gd[open] summary{border-bottom:1px solid var(--line)}
.gd>.ic{margin:8px}
.dt{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);background:transparent;padding:0;cursor:pointer;flex:none}
.dt.on{background:#2e9e5b;border-color:#2e9e5b}
</style>
<style id="nst">
.nd{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.nr{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.nr input{margin:0;padding:8px 6px}
.nr output{font-weight:700;text-align:center;font-size:15px;min-height:1.6em;background:var(--bg);border:1px dashed var(--line);border-radius:4px;padding:6px 2px;display:block}
@media (max-width:520px){.nr{grid-template-columns:1fr 1fr 1fr}.nr .nn{grid-column:1/-1}}
</style>
<style id="hst">
:root{--brand:#004b85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#8cc4f5}}
:root[data-theme="dark"]{--brand:#8cc4f5}
header{background:var(--surf);color:var(--ink);border-bottom:1px solid var(--line);padding:10px 14px;gap:10px}
.mark{width:50px;height:50px;border-radius:10px;object-fit:contain}
.hbrand{display:flex;flex-direction:column;line-height:1.3}
.hbrand h1{font-size:19px;color:var(--brand);margin:0}
.hbrand small{color:var(--mut);font-size:13px}
.hb{color:var(--brand)}
.chip{margin-inline-start:auto;display:flex;align-items:center;gap:7px;background:#e6f4ea;color:#1b5e35;border-radius:20px;padding:7px 13px;font-size:13px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:#27ae60;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{background:#1d3a2a;color:#9fe0b4}}
:root[data-theme="dark"] .chip{background:#1d3a2a;color:#9fe0b4}
nav#nav{display:none}
main{padding-bottom:96px}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 4px;background:var(--surf);border-radius:14px;padding:20px 2px 16px}
.tl2{border:0;background:none;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;line-height:1.35;text-align:center;cursor:pointer;padding:0 2px}
.ti{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.ti svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bn{position:fixed;inset:auto 0 0 0;z-index:10;display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bn button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;cursor:pointer}
.bn button.on{color:var(--brand);font-weight:700}
.bn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#fxt{width:100%;min-height:44vh;line-height:1.7}
@media screen{#pbody.edm{outline:2px dashed #e8a317;outline-offset:6px}}
@media print{.bn{display:none!important}}#pbody.edm .stp{touch-action:none;outline:1px dashed #e8a317;cursor:move}@media screen{#doc .tb{gap:6px}#doc .tb button,#doc .tb select{padding:7px 10px;font-size:13px}}
</style>
<style id="brst">
#m label.b{display:inline-block;font:inherit;font-size:14px;font-weight:500;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:var(--surf);color:var(--ink)}
.brtop input{font-weight:700;margin:0 0 10px}
.brtop b{display:block;margin-bottom:10px;font-size:16px}
.brnav{align-items:center;margin-bottom:8px}
.brnav .brcnt{font-weight:700;min-width:84px;text-align:center}
.brchips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:4px}
.brchips button{flex:none;min-width:38px;padding:6px 10px}
.brchips button.on{background:var(--acc);border-color:var(--acc);color:#1b2430;font-weight:700}
#brz{overflow:auto;background:#cfd4da;border:1px solid var(--line);border-radius:6px;padding:6px;max-height:78vh;-webkit-overflow-scrolling:touch;margin-bottom:10px}
.brp{position:relative;width:100%;height:0;padding-top:calc(var(--r)*100%);margin:0 auto;overflow:hidden;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.3);direction:ltr;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.brbg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none;user-select:none}
.brp.brmiss::after{content:"صورة الصفحة الأصلية مش موجودة — ارفعها من زر «رفع صور البروشور الأصلي» في قائمة البروشور";position:absolute;left:8%;right:8%;top:40%;text-align:center;color:#b00020;font-size:1.8em;line-height:1.5;direction:rtl}
.bril{position:absolute;left:0;top:0;right:0;bottom:0}
.bri{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;cursor:move}
.bri.sel{outline:2px dashed #e8a317;outline-offset:1px}
.brtx{white-space:pre-wrap;word-break:break-word;line-height:1.35;padding:.25em .5em}
.bri img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.brh{position:absolute;right:-13px;bottom:-13px;width:26px;height:26px;border-radius:50%;background:#e8a317;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);touch-action:none;cursor:nwse-resize}
.brsw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brsw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.brpp{margin:0 auto 14px;max-width:100%}
.brbox{border:1px dashed var(--line);border-radius:6px;padding:10px;margin-bottom:10px;background:var(--surf)}
@media print{#pbody .brpp{width:190mm;max-width:none;margin:0 auto;break-after:page;page-break-after:always}#pbody .brpp:last-child{break-after:auto;page-break-after:auto}#pbody .brpp .brp{font-size:1.9mm!important;box-shadow:none}#pbody .brpp *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

function parseVcf(t){t=t.replace(/=\r?\n/g,'').replace(/\r?\n[ \t]/g,'');var out=[];t.split(/BEGIN:VCARD/i).slice(1).forEach(function(card){var r={name:'',phones:[],emails:[],role:''},nn='';card.split(/\r?\n/).forEach(function(l){var i=l.indexOf(':');if(i<0)return;var k=l.slice(0,i),v=l.slice(i+1);if(/QUOTED-PRINTABLE/i.test(k)){try{v=decodeURIComponent(v.replace(/=([0-9A-F]{2})/gi,'%$1'))}catch(x){}}var kk=k.split(';')[0].toUpperCase().replace(/^.*\./,'');if(kk==='FN')r.name=v.trim();else if(kk==='N')nn=v.split(';').reverse().join(' ').trim();else if(kk==='TEL')r.phones.push(v.trim());else if(kk==='EMAIL')r.emails.push(v.trim());else if(kk==='TITLE')r.role=v.trim()});if(!r.name)r.name=nn;out.push(r)});return out}

function hE(){return tab==='works'||tab==='quotes'}
function pnum(s){return parseFloat(String(s||'').replace(/,/g,'').replace(/[^\d.\-]/g,''))||0}

function wRecalc(pb){var sel=window.getSelection?window.getSelection():null,act=sel&&sel.anchorNode,s=0;
pb.querySelectorAll('td.ft').forEach(function(ft){var tr=ft.parentNode,q=tr.querySelector('.fq'),p=tr.querySelector('.fp'),v;
if(act&&ft.contains(act))v=pnum(ft.textContent);else{v=pnum(q?q.textContent:0)*pnum(p?p.textContent:0);ft.textContent=fmt(v)}s+=v});
var tx=num(cur.tax),t=s*tx/100;

var wTm,wLast=null;
document.addEventListener('input',function(e){if(!hE()||edit===null)return;var pb=e.target&&e.target.closest?e.target.closest('#pbody'):null;if(!pb||!pb.isContentEditable)return;
wRecalc(pb);clearTimeout(wTm);wTm=setTimeout(function(){wSave(pb,true)},500)});
document.addEventListener('selectionchange',function(){var pb=document.getElementById('pbody'),s=window.getSelection&&window.getSelection();if(pb&&s&&s.anchorNode&&pb.contains(s.anchorNode))wLast=s.anchorNode});
function wTr(){var n=wLast;while(n&&n.nodeName!=='TR')n=n.parentNode;return n}
function wNumber(tbl){var k=0;tbl.querySelectorAll('tr').forEach(function(tr){if(tr.querySelector('td.ft')){k++;tr.cells[0].textContent=k}})}
function wAddRow(pb){if(!pb.isContentEditable){alert('اضغط ✎ تعديل على العرض الأول');return}
var tr=wTr();if(!tr||!pb.contains(tr)||tr.querySelector('th,.gs,.gv,.gn,.yl'))tr=null;
if(!tr){var f=pb.querySelectorAll('td.ft');if(f.length)tr=f[f.length-1].parentNode}
if(!tr){alert('اضغط جوه الصف اللي عايز تضيف بعده');return}
var nr=tr.cloneNode(true),fin=!!nr.querySelector('td.ft');
if(fin){nr.cells[1].textContent='بند جديد';nr.querySelector('.fq').textContent='1';nr.querySelector('.fp').textContent='0';nr.querySelector('.ft').textContent='0'}
else Array.prototype.forEach.call(nr.cells,function(c){c.textContent=''});
tr.parentNode.insertBefore(nr,tr.nextSibling);if(fin)wNumber(tr.closest('table'));wRecalc(pb);wSave(pb,true)}
function wDelRow(pb){if(!pb.isContentEditable){alert('اضغط ✎ تعديل على العرض الأول');return}
var tr=wTr();if(!tr||!pb.contains(tr)||tr.querySelector('th,.gs,.gv,.gn,.yl')){alert('اضغط جوه الصف اللي عايز تحذفه (مش العنوان ولا الإجماليات)');return}
